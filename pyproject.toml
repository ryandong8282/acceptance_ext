[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "acceptance-ext"
version = "0.1.0"
description = "Grounded, schema-driven extraction laboratory for Chinese construction acceptance standards"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Acceptance Ext contributors"}]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
docling = ["docling>=2.0"]
langextract = ["langextract>=1.0"]
llm = ["openai>=1.40"]
server = ["fastapi>=0.115", "python-multipart>=0.0.9", "uvicorn>=0.30"]
dev = ["pytest>=8.2", "ruff>=0.6"]
all = [
  "pymupdf>=1.24",
  "docling>=2.0",
  "langextract>=1.0",
  "openai>=1.40",
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[project.scripts]
acceptance-ext = "acceptance_ext.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/acceptance_ext"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
