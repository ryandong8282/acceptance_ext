name: bootstrap-missing-project

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/bootstrap_missing_project.py
      - .github/workflows/bootstrap-missing-project.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create source only when missing
        run: python scripts/bootstrap_missing_project.py .
      - name: Commit generated project
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Canonical source already present; nothing to bootstrap."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap grounded acceptance extraction lab"
          git push
